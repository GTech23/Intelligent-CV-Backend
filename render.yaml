services:
  - type: web
    name: puppeteer-service
    env: node
    buildCommand: |
      apt-get update
      apt-get install -y \
        chromium \
        libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
        libxi6 libxtst6 libnss3 libxrandr2 libasound2 libpangocairo-1.0-0 \
        libatk1.0-0 libcups2 libdrm2 libgbm1 libpango-1.0-0 libxkbcommon0
      npm install
    startCommand: npm start
